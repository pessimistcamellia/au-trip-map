    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('au-trip-map:user-state:v1') || '{}')
        const dark =
          saved.theme === 'dark' ||
          (saved.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        const background = dark ? '#191b1c' : '#fafaf7'
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.backgroundColor = background
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('#theme-color').setAttribute('content', background)
      } catch {}
    </script>
